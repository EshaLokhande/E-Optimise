name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node -e "require('./server.js')" &
        timeout-minutes: 1

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/e-optimise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/e-optimise/package-lock.json
      - run: npm ci
      - run: npm run compile --if-present
      - run: npm run lint --if-present
